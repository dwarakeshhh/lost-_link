# ===== Server =====
server.port=8080

# ===== MySQL Database =====
# The database will be created automatically if it doesn't exist.
spring.datasource.url=jdbc:mysql://localhost:3306/lostlink_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=0216
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# 'update' auto-creates/alters tables from the entities on startup - fine for a college project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== File upload (added in Step 9 - image upload) =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
lostlink.upload.dir=uploads

# ===== Error handling =====
server.error.include-stacktrace=never
server.error.include-message=always
