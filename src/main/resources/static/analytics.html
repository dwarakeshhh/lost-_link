<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — LostLink</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">🔎 LOSTLINK<small>Campus Lost &amp; Found</small></a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="post.html">Post Found Item</a>
        <a href="analytics.html" class="active">Analytics</a>
      </nav>
    </div>
  </header>

  <div class="container" style="padding-bottom:48px;">
    <h1 style="margin-top:24px;">Analytics Dashboard</h1>

    <div id="statsGrid" class="stats-grid">
      <p style="color:#64748b;">Loading...</p>
    </div>

    <div class="charts-grid">
      <div class="card">
        <h3>Items by Category</h3>
        <div id="categoryChart"></div>
      </div>
      <div class="card">
        <h3>Items by Location</h3>
        <div id="locationChart"></div>
      </div>
    </div>

    <div class="card">
      <h3>Recently Claimed</h3>
      <div id="recentClaimed"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
