<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LostLink — Campus Lost & Found</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">🔎 LOSTLINK<small>Campus Lost &amp; Found</small></a>
      <nav class="nav">
        <a href="index.html" class="active">Home</a>
        <a href="search.html">Search</a>
        <a href="post.html">Post Found Item</a>
        <a href="analytics.html">Analytics</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <section class="hero">
      <h1>Lost something on campus?</h1>
      <p>Find it fast, or help someone else find theirs — no login needed.</p>
      <div class="hero-actions">
        <a href="post.html" class="btn btn-primary btn-lg">📷 Post Found Item</a>
        <a href="search.html" class="btn btn-outline btn-lg">🔍 Search Lost Items</a>
      </div>
    </section>

    <div id="feed" class="feed-grid">
      <p style="text-align:center;color:#64748b;grid-column:1/-1;">Loading items...</p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/items.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadFeedInto(document.getElementById('feed'));
    });
  </script>
</body>
</html>
